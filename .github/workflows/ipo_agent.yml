name: Weekly IPO Analysis Agent

on:
  schedule:
    # 03:30 UTC എന്നത് ഇന്ത്യൻ സമയം (IST) രാവിലെ 09:00 AM ആണ്.
    # 1,3,5 എന്നത് യഥാക്രമം തിങ്കൾ, ബുധൻ, വെള്ളി ദിവസങ്ങളെ സൂചിപ്പിക്കുന്നു.
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch: # നിങ്ങൾക്ക് എപ്പോൾ വേണമെങ്കിലും മാന്വൽ ആയി റൺ ചെയ്യാൻ ഈ ഓപ്ഷൻ സഹായിക്കും

jobs:
  run-ipo-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: Run IPO Analysis Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python ipo_agent.py
