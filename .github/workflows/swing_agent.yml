name: Pro Swing Agent

on:
  schedule:
    # 22:30 UTC എന്നത് ഇന്ത്യൻ സമയം എല്ലാ ദിവസവും പുലർച്ചെ 4:00 AM ആണ്
    - cron: '30 22 * * *'
  workflow_dispatch: 

jobs:
  run-swing-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # പുതിയ പൈത്തൺ വേർഷൻ അപ്ഡേറ്റ് ചെയ്തു

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta google-genai

      - name: Run Pro Swing Agent Script
        env:
          IPO_GEMINI_API_KEY: ${{ secrets.IPO_GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python swing_agent.py
