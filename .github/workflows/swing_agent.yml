name: Pro Swing Agent

on:
  schedule:
    # 22:30 UTC എന്നത് ഇന്ത്യൻ സമയം എല്ലാ ദിവസവും പുലർച്ചെ 4:00 AM ആണ്
    - cron: '30 22 * * *'
  workflow_dispatch: # നിങ്ങൾക്ക് എപ്പോൾ വേണമെങ്കിലും സ്വയം റൺ ചെയ്യാൻ (Manual trigger)

jobs:
  run-swing-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta google-genai

      - name: Run Pro Swing Agent Script
        env:
          IPO_GEMINI_API_KEY: ${{ secrets.IPO_GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          # നിങ്ങളുടെ പൈത്തൺ ഫയലിന്റെ പേര് ഇവിടെ നൽകുക. ഉദാഹരണത്തിന്: swing_agent.py
          python swing_agent.py
