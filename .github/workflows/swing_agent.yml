name: Pro Swing Agent

on:
  schedule:
    # 19:30 UTC on Tue, Thu, Fri, Sat corresponds to Wed, Fri, Sat, Sun at 1:00 AM IST
    - cron: '30 19 * * 2,4,5,6'
  workflow_dispatch: 
    inputs:
      run_mode:
        description: 'Run Mode (auto = Day-wise logic / full / top_80)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - top_80
          - full

permissions:
  contents: write

jobs:
  run-swing-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta google-genai requests cloudscraper

      - name: Run Pro Swing Agent Script
        env:
          IPO_GEMINI_API_KEY: ${{ secrets.SREE_GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
        run: |
          python swing_agent.py
          
      - name: Save Previous Stocks & Cache Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add previous_stocks.json cache_analysis.json
          git commit -m "Auto-update: previous stocks and cache data" || echo "No changes to commit"
          git push
