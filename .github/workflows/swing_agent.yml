name: Pro Swing Agent

on:
  schedule:
    # 22:30 UTC എന്നത് ഇന്ത്യൻ സമയം എല്ലാ ദിവസവും പുലർച്ചെ 4:00 AM ആണ്
    - cron: '30 22 * * *'
  workflow_dispatch: 
    inputs:
      run_mode:
        description: 'Run Mode (auto = Monday Full / Daily Top 80)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - top_80
          - full

permissions:
  contents: write

jobs:
  run-swing-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta google-genai requests cloudscraper

      - name: Run Pro Swing Agent Script
        env:
          IPO_GEMINI_API_KEY: ${{ secrets.IPO_GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
        run: |
          python swing_agent.py
          
      - name: Save Previous Stocks Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add previous_stocks.json
          git commit -m "Auto-update: previous stocks data" || echo "No changes to commit"
          git push
