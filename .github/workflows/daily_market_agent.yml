name: Daily Stock Market Agent

on:
  schedule:
    # തിങ്കൾ മുതൽ വെള്ളി വരെ വൈകുന്നേരം 4:30 PM IST (11:00 AM UTC)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # മാനുവലായി റൺ ചെയ്യാനുള്ള ബട്ടൺ നൽകുന്നു

jobs:
  run-market-agent:
    runs-on: ubuntu-latest

    steps:
      - name: കോഡ് ഡൗൺലോഡ് ചെയ്യുന്നു
        uses: actions/checkout@v4

      - name: പൈത്തൺ സെറ്റപ്പ് ചെയ്യുന്നു
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ലൈബ്രറികൾ ഇൻസ്റ്റാൾ ചെയ്യുന്നു
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: സ്ക്രിപ്റ്റ് റൺ ചെയ്യുന്നു
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python market_agent_pro.py
