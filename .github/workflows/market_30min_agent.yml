name: AI 30-Min Market Agent

on:
  schedule:
    - cron: '20,50 4-9 * * 1-5'
  workflow_dispatch:

jobs:
  analyze_and_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Python 3.11 ലേക്ക് മാറ്റി
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # google-generativeai എന്നതിന് പകരം പുതിയ google-genai ഇൻസ്റ്റാൾ ചെയ്യുന്നു
      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta gspread oauth2client google-genai

      - name: Run AI 30-Min Market Agent Script
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python market_30min_agent.py
