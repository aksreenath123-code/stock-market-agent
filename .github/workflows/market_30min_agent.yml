name: AI 30-Min Market Agent

on:
  schedule:
    # 1. രാവിലെ ആദ്യത്തെ 30 മിനിറ്റ് ഇന്റർവലുകൾ (9:15, 9:45, 10:15, 10:45, 11:15 IST)
    - cron: '45 3 * * 1-5'
    - cron: '15,45 4,5 * * 1-5'
    - cron: '15 6 * * 1-5'

    # 2. ഉച്ചയ്ക്ക് ശേഷമുള്ള 1 മണിക്കൂർ ഇന്റർവലുകൾ (12:15, 1:15, 2:15 IST)
    - cron: '45 6 * * 1-5'
    - cron: '45 7 * * 1-5'
    - cron: '45 8 * * 1-5'

    # 3. രാത്രി 8:30 PM IST-ക്ക് (15:00 UTC) ഡെയ്‌ലി കൺസോളിഡേറ്റഡ് & മണി കൺട്രോൾ പ്രോ റിപ്പോർട്ട്
    - cron: '0 15 * * 1-5'

  workflow_dispatch:

jobs:
  analyze_and_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta gspread oauth2client google-genai beautifulsoup4 requests

      - name: Run AI Market Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.RECEIVER_EMAIL }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          MONEYCONTROL_COOKIE: ${{ secrets.MONEYCONTROL_COOKIE }} # മണി കൺട്രോൾ പ്രോ കുക്കി ഇവിടെ ചേർത്തിരിക്കുന്നു
        run: python market_30min_agent.py
