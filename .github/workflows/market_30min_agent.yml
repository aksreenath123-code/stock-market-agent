name: AI 30-Min Market Agent

on:
  schedule:
    # കൃത്യം 9:50 AM IST മുതൽ 3:20 PM IST വരെ ഓരോ 30 മിനിറ്റിലും (തിങ്കൾ മുതൽ വെള്ളി വരെ)
    # 4:20 UTC = 9:50 IST, 4:50 UTC = 10:20 IST. 
    - cron: '20,50 4-9 * * 1-5'
  
  # മാനുവൽ ആയി എപ്പോൾ വേണമെങ്കിലും റൺ ചെയ്യാൻ
  workflow_dispatch:

jobs:
  analyze_and_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # പഴയ ഇൻസ്റ്റലേഷൻ ഇഷ്യൂസ് വരാതിരിക്കാൻ പാക്കേജുകൾ ഡയറക്റ്റ് ആയി ഇൻസ്റ്റാൾ ചെയ്യുന്നു
      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta gspread oauth2client google-generativeai

      - name: Run AI 30-Min Market Agent Script
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python market_30min_agent.py
