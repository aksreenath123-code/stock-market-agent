name: AI Smart Market Agent

on:
  schedule:
    # --- ഇൻട്രാഡേ സീക്വൻഷ്യൽ റണ്ണുകൾ ---
    # 9:30 AM, 10:30 AM, 11:30 AM IST (4:00, 5:00, 6:00 UTC)
    - cron: '0 4,5,6 * * 1-5'
    
    # 9:45 AM IST (4:15 UTC)
    - cron: '15 4 * * 1-5'
    
    # 10:00 AM, 1:00 PM, 2:00 PM, 3:00 PM IST (4:30, 7:30, 8:30, 9:30 UTC)
    - cron: '30 4,7,8,9 * * 1-5'

    # --- നൈറ്റ് കൺസോളിഡേറ്റഡ് റിപ്പോർട്ട് ---
    # 8:30 PM IST (15:00 UTC)
    - cron: '0 15 * * 1-5'

  workflow_dispatch:

jobs:
  analyze_and_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta gspread oauth2client google-genai beautifulsoup4 requests

      - name: Run AI Market Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.RECEIVER_EMAIL }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          MONEYCONTROL_COOKIE: ${{ secrets.MONEYCONTROL_COOKIE }}
        run: python market_30min_agent.py
