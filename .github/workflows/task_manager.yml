YAML
name: Weekly Task Manager AI

on:
  schedule:
    # എല്ലാ ശനിയാഴ്ചയും രാവിലെ 9:00 AM IST (03:30 UTC) ന് റൺ ചെയ്യുന്നു
    - cron: '30 3 * * 6'
  workflow_dispatch:

jobs:
  run_task_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas google-genai

      - name: Run Task Manager AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVERS }} 
          TASK_SHEET_ID: ${{ secrets.TRIDENT_TASK_SHEET_ID }}
        run: python task_manager_agent.py

          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }} 
          TASK_SHEET_ID: ${{ secrets.TASK_SHEET_ID }}
        run: python task_manager_agent.py
