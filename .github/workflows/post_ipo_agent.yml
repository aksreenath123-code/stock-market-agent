name: Master Swing Agent (IPO & Earnings)

on:
  schedule:
    # 18:00 UTC എന്നത് ഇന്ത്യൻ സമയം എല്ലാ ദിവസവും രാത്രി 11:30 PM ആണ്
    - cron: '0 18 * * *'
  workflow_dispatch: 
#UPDATED
jobs:
  run-master-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: Run Master Swing Script
        env:
          SREE_GEMINI_API_KEY: ${{ secrets.SREE_GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          MONEYCONTROL_COOKIE: ${{ secrets.MONEYCONTROL_COOKIE }}
        run: |
          python post_ipo_agent.py
