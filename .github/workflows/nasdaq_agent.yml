name: Nasdaq Momentum Screener

on:
  schedule:
    - cron: '30 20 * * 0,2,3'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # പൈത്തൺ വേർഷൻ 3.12 ആയി മാറ്റി

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas google-genai pandas-ta

      - name: Run Nasdaq Agent
        env:
          SREE_GEMINI_KEY: ${{ secrets.SREE_GEMINI_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python nasdaq_agent.py
