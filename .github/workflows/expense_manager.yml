name: Weekly Clinic Expense AI

on:
  schedule:
    - cron: '45 3 * * 6' # ശനിയാഴ്ച രാവിലെ 9:15 AM IST
  workflow_dispatch:

jobs:
  run_expense_report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas google-genai

      - name: Run Expense AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECEIVERS: ${{ secrets.GMAIL_RECEIVERS }}
          EXPENSE_SHEET_ID: ${{ secrets.EXPENSE_SHEET_ID }}
        run: python -u expense_manager_agent.py
